<html lang="en">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
     <nav class="navegador">
        <ul class="lista">
            <a href="">
            <li class="elementos ">
                <img src="la-matanza-seeklogo.png" class="logo" style="height: 40px; width: 40px;">
                <div class="contenido">
                    <h2>La matanza</h2>
                </div>
            </li>
            </a>
            <a href="">
            <li class="elementos">
                <i class="bi bi-house"></i>

                <div class="contenido">
                    <p class="elemento-texto">Inicio</p>
                </div>
            </li>
            </a>
            <a href="index.html">
            <li class="elementos">
                <i class="bi bi-0-circle"></i>

                <div class="contenido">
                    <p class="elemento-texto">administrador</p>
                </div>
            </li>
            </a>
            <a href="promotoras.html">
            <li class="elementos ">
                <i  class="bi bi-file-earmark-person"></i>

                <div class="contenido">
                    <p class="elemento-texto">Promotoras
                </div>
            </li>
            </a>

            <a href="calendario.html">
            <li class="elementos">
                <i class="bi bi-calendar2-week"></i>

                <div class="contenido">
                    <p class="elemento-texto">calendario</p>
                </div>
            </li>
            </a>
                <li class="elementos">
                    <img src="" alt="" style="height: 40px;width: 40px;border-radius: 100%; background: linear-gradient(to top, rgb(15, 15, 250),rgba(0,0,0,0.5));" class="logo">
                    <div class="contenido">
                    <p class="elemento-texto">Mateo</p>
                </div>
            </li>

        </ul>
    </nav>

     <div class="app-container">
        <div class="calendar-section">
            <div class="calendario">
                <button class="nav-btn" id="prev-year">&lt;&lt;</button>
                <button class="nav-btn" id="prev-month">&lt;</button>
                <h2 id="month-year-display"></h2>
                <button class="nav-btn" id="next-month">&gt;</button>
                <button class="nav-btn" id="next-year">&gt;&gt;</button>
            </div>

            <div class="weekdays">
                <div>Domingo</div><div>Lunes</div><div>Martes</div><div>Miércoles</div><div>Jueves</div><div>Viernes</div><div>Sábado</div>
            </div>

            <div class="days-grid" id="days-container"></div>
        </div>

        <div class="data-panel">
            <h3 id="panel-title">Selecciona un día</h3>
            <textarea id="data-input" placeholder="Deja anotado el nombre del grupo para recordarlo" disabled ></textarea>
            <form action="" class="formulario" method="GET">
                <label for="">Ingrese una tarea para el dia asignado</label>
                <br>
                <input type="text" name="tarea" placeholder="Ingrese tarea">
                <br>
                <label for="">Ingrese una grupo que realiza la tarea</label>
                <br>
                <input type="text" placeholder="ingrese el grupo">
                <br>
                <label for="">Ingrese una lugar que see realiza la tarea</label>
                <br>
                <input type="text" name="lugar" placeholder="ingrese el lugar">
                <br>
                <input type="submit" value="Enviar datos" class="btn-save-form">
            </form>
            <button class="btn-save" id="save-btn" disabled>Guardar Datos</button>
            <button class="btn-delete" id="delete-btn" disabled>Eliminar Datos</button>
        </div>
    </div>

    <script src="./js/calendario.js"></script>
</body>
</html>
